server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    # Logs sur stdout/stderr (idiome conteneur : récupérés par `docker logs`).
    access_log /dev/stdout;
    error_log  /dev/stderr;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # DNS Docker : résolution de l'upstream à la requête (et non au démarrage), via une
    # variable. Évite l'échec si php n'est pas encore up et l'IP figée si php redémarre.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Cible le container_name (unique sur le réseau partagé `antibes`),
        # pas le nom de service `php` (risque de collision inter-projets).
        set $upstream pea_php:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Bloque l'accès aux fichiers cachés (sauf .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
