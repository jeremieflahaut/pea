# Overlay PROD (explicite) : docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
# Ne contient QUE les surcharges prod (routage Traefik). Tout le reste — images, noms,
# réseau, volumes, scheduler — vient du base. Images tirées de GHCR (le `build` du base
# n'est pas déclenché tant qu'on fait `pull` puis `up -d` sans `--build`).
services:

  nginx:
    labels:
      traefik.enable: "true"
      traefik.http.routers.pea-api.rule: "Host(`api-pea.dev-fullstack.net`)"
      traefik.http.routers.pea-api.entrypoints: "websecure"
      traefik.http.routers.pea-api.tls.certresolver: "myresolver"
      traefik.http.services.pea-api.loadbalancer.server.port: "80"

  nuxt:
    labels:
      traefik.enable: "true"
      traefik.http.routers.pea-front.rule: "Host(`pea.dev-fullstack.net`)"
      traefik.http.routers.pea-front.entrypoints: "websecure"
      traefik.http.routers.pea-front.tls.certresolver: "myresolver"
      traefik.http.services.pea-front.loadbalancer.server.port: "3000"
