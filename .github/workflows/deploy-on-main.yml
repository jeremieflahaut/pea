name: Deploy on push to main

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  FRONT_IMAGE: ghcr.io/jeremieflahaut/pea/nuxt
  PHP_IMAGE: ghcr.io/jeremieflahaut/pea/php
  NGINX_IMAGE: ghcr.io/jeremieflahaut/pea/nginx
  SCRAPER_IMAGE: ghcr.io/jeremieflahaut/pea/scraper
  SHA_TAG: sha-${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            scraper:
              - 'scraper/**'

      - name: Login to GHCR
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true' || steps.changes.outputs.scraper == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le VPS n'est pas (plus) un checkout git : on lui livre les fichiers compose par scp.
      # Les images viennent de GHCR ; le VPS n'a besoin que de ces 2 fichiers + son env.
      - name: Sync compose files to VPS
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true' || steps.changes.outputs.scraper == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 5906
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "/home/debian/projects/pea"

      # --- FRONTEND (Nuxt) ---
      - name: Build & push Nuxt image
        if: steps.changes.outputs.frontend == 'true'
        run: |
          docker build -t $FRONT_IMAGE:latest -t $FRONT_IMAGE:${SHA_TAG} -f frontend/Dockerfile ./frontend
          docker push $FRONT_IMAGE --all-tags

      - name: Deploy Nuxt to VPS
        if: steps.changes.outputs.frontend == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 5906
          script_stop: true
          script: |
            cd /home/debian/projects/pea
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull nuxt
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans nuxt
            docker image prune -f

      # --- BACKEND (php-fpm + nginx) ---
      - name: Build & push PHP-FPM image
        if: steps.changes.outputs.backend == 'true'
        run: |
          docker build --target prod -t $PHP_IMAGE:latest -t $PHP_IMAGE:${SHA_TAG} -f backend/Dockerfile ./backend
          docker push $PHP_IMAGE --all-tags

      - name: Build & push nginx image
        if: steps.changes.outputs.backend == 'true'
        run: |
          docker build -t $NGINX_IMAGE:latest -t $NGINX_IMAGE:${SHA_TAG} -f backend/docker/nginx/Dockerfile ./backend
          docker push $NGINX_IMAGE --all-tags

      - name: Deploy backend to VPS
        if: steps.changes.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 5906
          script_stop: true
          script: |
            cd /home/debian/projects/pea
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull php nginx
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans php nginx scheduler
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T php php artisan migrate --force
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T php php artisan optimize:clear
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T php php artisan package:discover --ansi
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T php php artisan config:cache
            docker image prune -f

      # --- SCRAPPER (python) ---
      - name: Build & push Scraper image
        if: steps.changes.outputs.scraper == 'true'
        run: |
          docker build -t $SCRAPER_IMAGE:latest -t $SCRAPER_IMAGE:${SHA_TAG} -f scraper/Dockerfile ./scraper
          docker push $SCRAPER_IMAGE --all-tags

      - name: Deploy Scraper to VPS
        if: steps.changes.outputs.scraper == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 5906
          script_stop: true
          script: |
            cd /home/debian/projects/pea
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull scraper
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans scraper
            docker image prune -f
